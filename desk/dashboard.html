<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memecoin-desk</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --wash: rgba(11,11,11,0.04);
  --series-1: #2a78d6; --series-track: #cde2fb;
  --good: #0ca30c; --critical: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
    --series-1: #3987e5; --series-track: #0d366b;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; }
header.top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
h1 { font-size: 18px; margin: 0; font-weight: 650; }
.brand { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.tag { font-size: 12px; color: var(--ink-2); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.status { font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; flex: none; }
.dot.on { background: var(--good); }
.status strong { color: var(--ink); font-weight: 600; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
.card h2 { font-size: 14px; font-weight: 600; margin: 0; }
.card .sub { color: var(--ink-2); font-size: 12.5px; margin: 2px 0 0; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.stack { display: grid; gap: 16px; }
.kpis { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.5fr) repeat(3, minmax(0, 1fr)); }
.grid2 { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 900px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } .kpis .hero { grid-column: 1 / -1; } }
@media (max-width: 720px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) { .kpis { grid-template-columns: minmax(0, 1fr); } }

.label { color: var(--ink-2); font-size: 13px; }
.hero .value { font-size: 48px; line-height: 1.1; font-weight: 650; letter-spacing: -0.02em; margin: 4px 0 6px; overflow-wrap: anywhere; }
.tile .value { font-size: 26px; line-height: 1.2; font-weight: 650; margin: 4px 0 4px; }
@media (max-width: 420px) { .hero .value { font-size: 40px; } }
.note { color: var(--ink-2); font-size: 12.5px; }
.delta { display: inline-flex; align-items: baseline; gap: 5px; white-space: nowrap; }
.delta .glyph { font-size: 0.72em; color: var(--muted); }
.delta.up .glyph { color: var(--good); }
.delta.down .glyph { color: var(--critical); }
.hero .delta { font-size: 15px; font-weight: 600; }

button.ghost { font: inherit; font-size: 12.5px; color: var(--ink-2); background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
button.ghost:hover { background: var(--wash); }
button.ghost[aria-pressed="true"] { color: var(--ink); background: var(--wash); }
:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }

.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font: 11.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); font-variant-numeric: tabular-nums; }
.chart text.end { fill: var(--ink); font-size: 12.5px; font-weight: 600; }

.scroll { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--ink-2); font-size: 12px; padding: 6px 12px 6px 0; border-bottom: 1px solid var(--grid); white-space: nowrap; }
td { padding: 9px 12px 9px 0; border-bottom: 1px solid var(--grid); vertical-align: baseline; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
th:last-child, td:last-child { padding-right: 0; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.coin { font-weight: 600; }
.mint { color: var(--muted); font-size: 11.5px; font-weight: 400; margin-left: 6px; }
.strong { font-weight: 600; }
.wrap-cell { white-space: normal; min-width: 220px; }
.empty { color: var(--ink-2); padding: 14px 0 4px; font-size: 13px; }

.bars { display: grid; gap: 2px; }
.bar-row { display: grid; grid-template-columns: minmax(96px, 46%) minmax(0, 1fr); gap: 12px; align-items: center; padding: 5px 6px; margin: 0 -6px; border-radius: 6px; }
.bar-row:hover, .bar-row:focus-visible { background: var(--wash); }
.bar-row .name { font-size: 13px; overflow-wrap: anywhere; }
.bar-line { display: flex; align-items: center; gap: 8px; min-width: 0; }
.bar { height: 12px; min-width: 2px; background: var(--series-1); border-radius: 0 4px 4px 0; flex: none; }
.bar-val { font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--ink); min-width: 28px; }

.meters { display: grid; gap: 12px; }
.meter-row { display: grid; grid-template-columns: minmax(84px, 30%) minmax(0, 1fr) 44px; gap: 4px 12px; align-items: center; }
.meter-row .parts { grid-column: 1 / -1; color: var(--ink-2); font-size: 12px; }
.track { position: relative; height: 8px; border-radius: 999px; background: var(--series-track); }
.track .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--series-1); }
.track .limit { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink-2); }
.pill { font-size: 11px; font-weight: 500; color: var(--ink-2); border: 1px solid var(--border); border-radius: 999px; padding: 0 7px; margin-left: 6px; white-space: nowrap; }
.key { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 12px; }
.key i { width: 2px; height: 12px; background: var(--ink-2); display: inline-block; }
@media (max-width: 560px) {
  /* narrow: the bar drops under the name, and the kills table becomes a list */
  .meter-row { grid-template-columns: minmax(0, 1fr) auto; }
  .meter-row .track { grid-column: 1 / -1; grid-row: 2; }
  .mint { display: none; }
  table.stack thead { display: none; }
  table.stack tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 9px 0; border-bottom: 1px solid var(--grid); }
  table.stack tr:last-child { border-bottom: 0; }
  table.stack td { border: 0; padding: 0; white-space: normal; min-width: 0; }
  table.stack td.t-when { grid-column: 2; grid-row: 1; color: var(--muted); font-size: 12px; }
  table.stack td.t-coin { grid-column: 1; grid-row: 1; }
  table.stack td.t-stage { display: none; }
  table.stack td.t-why { grid-column: 1 / -1; color: var(--ink-2); }
}

.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.feed li { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 12px; font-size: 13px; align-items: baseline; }
.feed time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; white-space: nowrap; }

.tip { position: fixed; z-index: 10; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; box-shadow: 0 6px 20px rgba(0,0,0,0.14); max-width: 260px; }
.tip b { display: block; font-size: 14px; font-weight: 650; }
.tip span { color: var(--ink-2); display: block; }
.stale main { opacity: 0.55; }
footer { color: var(--muted); font-size: 12px; margin-top: 20px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Memecoin-desk</h1><span class="tag">Papirhandel · ingen rigtige penge</span></div>
    <div class="status" id="status" role="status">Henter …</div>
  </header>
  <main class="stack" id="main"></main>
  <footer id="foot"></footer>
</div>
<div class="tip" id="tip" hidden></div>

<script>
"use strict";
const SVG = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);

// All text from the desk (coin symbols, reasons) is untrusted: it only ever reaches the DOM
// through textContent / createTextNode in h().
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(3)) {
    if (kid == null || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return e;
}
function s(tag, attrs, text) {
  const e = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
}

// ---- formatting (Danish) ------------------------------------------------------
const nf = (d) => new Intl.NumberFormat("da-DK", { minimumFractionDigits: d, maximumFractionDigits: d });
const sign = (x) => (x > 0 ? "+" : x < 0 ? "−" : "");
const usd = (x, d = 2) => (x < 0 ? "−" : "") + "$" + nf(d).format(Math.abs(x));
const usdSigned = (x) => sign(x) + "$" + nf(2).format(Math.abs(x));
const pct = (x, d = 1) => sign(x) + nf(d).format(Math.abs(x)) + " %";
const num = (x, d = 0) => nf(d).format(x);
const pad = (n) => String(n).padStart(2, "0");
const MONTHS = ["jan.", "feb.", "mar.", "apr.", "maj", "jun.", "jul.", "aug.", "sep.", "okt.", "nov.", "dec."];
function clock(ts) { const d = new Date(ts * 1000); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function day(ts) { const d = new Date(ts * 1000); return d.getDate() + ". " + MONTHS[d.getMonth()]; }
function when(ts) { return day(ts) + " kl. " + clock(ts); }
function duration(sec) {
  if (sec < 90) return Math.round(sec) + " sek.";
  if (sec < 5400) return Math.round(sec / 60) + " min.";
  return num(sec / 3600, 1) + " t.";
}
function shortMint(m) { return m ? m.slice(0, 4) + "…" + m.slice(-4) : ""; }

function delta(value, text) {
  const dir = value > 0.0005 ? "up" : value < -0.0005 ? "down" : "flat";
  const word = dir === "up" ? "gevinst" : dir === "down" ? "tab" : "uændret";
  return h("span", { class: "delta " + dir },
    dir !== "flat" && h("span", { class: "glyph", role: "img", "aria-label": word, text: dir === "up" ? "▲" : "▼" }),
    h("span", { text }));
}

const RULES = {
  low_volume_1h: "For lav 1-times volumen", low_liquidity: "For lav likviditet",
  already_pumped: "Allerede steget for meget på 1 time", mint_authority: "Mint-rettighed ikke tilbagekaldt",
  freeze_authority: "Freeze-rettighed ikke tilbagekaldt", lp_unlocked: "LP ikke brændt eller låst",
  top10_concentration: "Top 10 ejer for meget", dev_holding: "Udvikleren ejer for meget",
  dev_rugs: "Udvikleren har tidligere rugs", bundled: "Bundtet lancering",
  data_unavailable: "Data kunne ikke bekræftes", score_below_min: "Score under grænsen",
  price_impact: "Ordren ville flytte prisen for meget", reentry_cooldown: "Karantæne efter salg",
  max_positions: "Maks. antal positioner nået", already_holding: "Ejes allerede",
  no_route: "Ingen handelsrute", no_cash: "Ikke nok kontanter", executor_other: "Afvist af Executor",
};
const STAGES = { filter: "Filter", analyst: "Analyst", executor: "Executor", risk: "Risk" };
const PARTS = [["momentum", "Momentum"], ["unique_buyers", "Købere"], ["buy_sell", "Køb/salg"],
               ["holder_growth", "Holdere"], ["liq_mcap", "Likviditet"], ["smart_wallets", "Smart wallets"]];
const EXITS = { stop_loss: "Stop loss", trailing_stop: "Trailing stop" };
const ruleName = (code) => RULES[code] || code;

function reasonText(stage, r) {
  const name = ruleName(r.code);
  if (stage === "analyst") {
    const m = /score ([\d.]+) < ([\d.]+)/.exec(r.detail || "");
    return m ? "Score " + num(+m[1], 1) + " (kræver " + num(+m[2]) + ")" : name;
  }
  // Purely numeric details ("$34,245 < $50,000", "+136.0% in 1h > +80%") are shown, with Danish separators.
  if (stage === "filter" && /^[-+$\d.,% <>]+( in 1h)?[-+$\d.,% <>]*$/.test(r.detail || "")) {
    const dk = r.detail.replace(/[.,]/g, (c) => (c === "." ? "," : "."));
    return name + " (" + dk.replace(" in 1h", " på 1 t.") + ")";
  }
  return name;
}

// ---- shared tooltip -----------------------------------------------------------
const tip = $("tip");
function showTip(x, y, strong, lines) {
  tip.replaceChildren(h("b", { text: strong }), ...lines.map((t) => h("span", { text: t })));
  tip.hidden = false;
  const r = tip.getBoundingClientRect();
  let left = x + 14, top = y - r.height - 12;
  if (left + r.width > innerWidth - 8) left = x - r.width - 14;
  if (left < 8) left = 8;
  if (top < 8) top = y + 16;
  tip.style.left = left + "px"; tip.style.top = top + "px";
}
function hideTip() { tip.hidden = true; }
function tipTarget(el, strong, lines) {
  el.addEventListener("pointermove", (e) => showTip(e.clientX, e.clientY, strong, lines));
  el.addEventListener("pointerleave", hideTip);
  el.addEventListener("focus", () => { const r = el.getBoundingClientRect(); showTip(r.left + r.width / 2, r.top, strong, lines); });
  el.addEventListener("blur", hideTip);
}

// ---- pieces -------------------------------------------------------------------
function card(title, sub, body, action) {
  return h("section", { class: "card" },
    h("div", { class: "card-head" },
      h("div", null, h("h2", { text: title }), sub && h("p", { class: "sub", text: sub })), action),
    body);
}

function kpis(a) {
  const hero = h("div", { class: "card hero" },
    h("div", { class: "label", text: "Kontoværdi" }),
    h("div", { class: "value", text: usd(a.equity) }),
    delta(a.pnl_usd, pct(a.return_pct, 2) + " · " + usdSigned(a.pnl_usd) + " siden start"),
    h("div", { class: "note", style: "margin-top:8px",
      text: "Start " + usd(a.starting_equity) + " · Kontant " + usd(a.cash) + " · I positioner " + usd(a.open_value) }));
  const tile = (label, value, note) => h("div", { class: "card tile" },
    h("div", { class: "label", text: label }), h("div", { class: "value" }, value), h("div", { class: "note" }, note));
  const trades = a.closed_trades;
  return h("div", { class: "kpis" }, hero,
    tile("Realiseret gevinst/tab", delta(a.realized_usd, usdSigned(a.realized_usd)),
      trades ? "på " + trades + (trades === 1 ? " lukket handel" : " lukkede handler") : "ingen lukkede handler endnu"),
    tile("Lukkede handler", num(trades),
      trades ? a.wins + " vundet · " + a.losses + " tabt · " + num(a.win_rate) + " % vundne" : "–"),
    tile("Urealiseret", delta(a.unrealized_usd, usdSigned(a.unrealized_usd)), "på åbne positioner lige nu"));
}

function niceTicks(lo, hi, n) {
  const raw = (hi - lo || 1) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), norm = raw / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
  const a = Math.floor(lo / step + 1e-9) * step, b = Math.ceil(hi / step - 1e-9) * step, out = [];
  for (let v = a; v <= b + step * 1e-6; v += step) out.push(+v.toFixed(8));
  return { ticks: out, step };
}
const TIME_STEPS = [300, 600, 900, 1800, 3600, 7200, 10800, 21600, 43200, 86400, 172800, 604800];
function timeTicks(t0, t1, target) {
  const step = TIME_STEPS.find((st) => (t1 - t0) / st <= target) || TIME_STEPS[TIME_STEPS.length - 1];
  const off = new Date(t0 * 1000).getTimezoneOffset() * 60, out = [];
  for (let t = Math.ceil((t0 - off) / step) * step + off; t <= t1; t += step) out.push(t);
  return { ticks: out, step };
}

let chartIndex = null;                       // survives re-renders so a keyboard user keeps their place
function equityChart(box, pts, start) {
  box.replaceChildren();
  const W = Math.max(280, box.clientWidth), H = 250, m = { t: 22, r: 86, b: 30, l: 58 };
  const svg = s("svg", { viewBox: "0 0 " + W + " " + H, tabindex: "0", role: "img" });
  let lo = Math.min(start, ...pts.map((p) => p[1])), hi = Math.max(start, ...pts.map((p) => p[1]));
  if (hi - lo < start * 0.002) { lo -= start * 0.001; hi += start * 0.001; }
  const yt = niceTicks(lo, hi, 4);
  lo = yt.ticks[0]; hi = yt.ticks[yt.ticks.length - 1];
  const t0 = pts[0][0], t1 = Math.max(pts[pts.length - 1][0], t0 + 60);
  const x = (t) => m.l + (t - t0) / (t1 - t0) * (W - m.l - m.r);
  const y = (v) => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);
  const dec = yt.step < 1 ? 2 : 0;

  for (const v of yt.ticks) {
    svg.append(s("line", { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: "var(--grid)", "stroke-width": 1 }));
    svg.append(s("text", { x: m.l - 8, y: y(v) + 4, "text-anchor": "end" }, usd(v, dec)));
  }
  const xt = timeTicks(t0, t1, W < 520 ? 3 : 6);
  for (const t of xt.ticks) {
    svg.append(s("text", { x: x(t), y: H - 9, "text-anchor": "middle" }, xt.step >= 86400 ? day(t) : clock(t)));
  }
  // reference: the starting balance
  svg.append(s("line", { x1: m.l, x2: W - m.r, y1: y(start), y2: y(start), stroke: "var(--axis)", "stroke-width": 1 }));

  svg.append(s("path", { d: pts.map((p, i) => (i ? "L" : "M") + x(p[0]).toFixed(1) + " " + y(p[1]).toFixed(1)).join(""),
    fill: "none", stroke: "var(--series-1)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
  const end = pts[pts.length - 1];
  svg.append(s("circle", { cx: x(end[0]), cy: y(end[1]), r: 5, fill: "var(--series-1)", stroke: "var(--surface)", "stroke-width": 2 }));
  svg.append(s("text", { class: "end", x: x(end[0]) + 10, y: y(end[1]) + 4 }, usd(end[1])));

  const hair = s("line", { y1: m.t, y2: H - m.b, stroke: "var(--axis)", "stroke-width": 1, visibility: "hidden" });
  const focus = s("circle", { r: 5, fill: "var(--series-1)", stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" });
  svg.append(hair, focus);

  function show(i) {
    chartIndex = i;
    const p = pts[i], r = svg.getBoundingClientRect(), k = r.width / W;
    hair.setAttribute("x1", x(p[0])); hair.setAttribute("x2", x(p[0])); hair.setAttribute("visibility", "visible");
    focus.setAttribute("cx", x(p[0])); focus.setAttribute("cy", y(p[1])); focus.setAttribute("visibility", "visible");
    showTip(r.left + x(p[0]) * k, r.top + y(p[1]) * k, usd(p[1]),
      [when(p[0]), pct((p[1] / start - 1) * 100, 2) + " siden start"]);
  }
  function hide() { hair.setAttribute("visibility", "hidden"); focus.setAttribute("visibility", "hidden"); hideTip(); }
  svg.addEventListener("pointermove", (e) => {
    const r = svg.getBoundingClientRect(), t = t0 + ((e.clientX - r.left) / r.width * W - m.l) / (W - m.l - m.r) * (t1 - t0);
    let best = 0;
    for (let i = 1; i < pts.length; i++) if (Math.abs(pts[i][0] - t) < Math.abs(pts[best][0] - t)) best = i;
    show(best);
  });
  svg.addEventListener("pointerleave", hide);
  svg.addEventListener("focus", () => show(Math.min(chartIndex ?? pts.length - 1, pts.length - 1)));
  svg.addEventListener("blur", hide);
  svg.addEventListener("keydown", (e) => {
    if (e.key === "Escape") return hide();
    const stepBy = e.key === "ArrowLeft" ? -1 : e.key === "ArrowRight" ? 1 : 0;
    if (!stepBy) return;
    e.preventDefault();
    show(Math.max(0, Math.min(pts.length - 1, (chartIndex ?? pts.length - 1) + stepBy)));
  });
  svg.setAttribute("aria-label", "Kontoværdi fra " + when(t0) + " til " + when(end[0]) + ": " +
    usd(pts[0][1]) + " til " + usd(end[1]) + ". Brug piletasterne for at læse punkterne.");
  box.append(svg);
}

let showEquityTable = false;
function equityCard(state) {
  const pts = state.equity_curve, start = state.account.starting_equity;
  const box = h("div", { class: "chart" });
  const changes = pts.filter((p, i) => i === 0 || i === pts.length - 1 || p[1] !== pts[i - 1][1]);
  const table = h("div", { class: "scroll", hidden: !showEquityTable },
    h("table", null,
      h("thead", null, h("tr", null, h("th", { text: "Tidspunkt" }), h("th", { class: "num", text: "Kontoværdi" }), h("th", { class: "num", text: "Siden start" }))),
      h("tbody", null, changes.map((p) => h("tr", null,
        h("td", { text: when(p[0]) }), h("td", { class: "num", text: usd(p[1]) }),
        h("td", { class: "num", text: pct((p[1] / start - 1) * 100, 2) }))))));
  const btn = h("button", { class: "ghost", type: "button", "aria-pressed": String(showEquityTable), text: "Vis som tabel",
    onclick: () => { showEquityTable = !showEquityTable; btn.setAttribute("aria-pressed", String(showEquityTable)); table.hidden = !showEquityTable; } });
  const sec = card("Kontoværdi over tid",
    "Kontant plus værdien af åbne positioner. Den grå linje er startbeløbet på " + usd(start, 0) + ".",
    h("div", null, box, table), btn);
  sec.dataset.chart = "1";
  sec._draw = () => pts.length > 1 && equityChart(box, pts, start);
  return sec;
}

function coinCell(t, cls) { return h("td", { class: cls }, h("span", { class: "coin", text: t.symbol }), h("span", { class: "mint", text: shortMint(t.mint) })); }

function openCard(rows) {
  if (!rows.length) return card("Åbne positioner", null, h("div", { class: "empty", text: "Ingen åbne positioner lige nu." }));
  const head = ["Mønt", "Lige nu", "Urealiseret", "Indsats", "Købt", "Stop", "Trailing stop", "Score"];
  return card("Åbne positioner", "Kurs og stop opdateres hvert 10. sekund, mens desken kører",
    h("div", { class: "scroll" }, h("table", null,
      h("thead", null, h("tr", null, head.map((t, i) => h("th", { class: [1, 2, 3, 5, 7].includes(i) ? "num" : null, text: t })))),
      h("tbody", null, rows.map((p) => h("tr", null,
        coinCell(p),
        h("td", { class: "num strong" }, delta(p.unrealized_pct, pct(p.unrealized_pct))),
        h("td", { class: "num", text: usdSigned(p.unrealized_usd) }),
        h("td", { class: "num", text: usd(p.cost_usd) }),
        h("td", { text: when(p.opened_ts) }),
        h("td", { class: "num", text: pct(p.stop_pct) + " fra køb" }),
        h("td", { text: p.trail_active ? "Aktiv" : "Ikke aktiveret endnu" }),
        h("td", { class: "num", text: num(p.score, 1) })))))));
}

function closedCard(rows) {
  if (!rows.length) return card("Lukkede handler", null, h("div", { class: "empty", text: "Ingen handler endnu. Desken køber først, når en mønt består alle filtre og scorer over grænsen." }));
  const head = ["Mønt", "Resultat", "Gevinst/tab", "Indsats", "Købt", "Varighed", "Top undervejs", "Solgt via", "Score"];
  return card("Lukkede handler", "Nyeste først. Resultat er efter prisvirkning og gebyrer ved både køb og salg.",
    h("div", { class: "scroll" }, h("table", null,
      h("thead", null, h("tr", null, head.map((t, i) => h("th", { class: [1, 2, 3, 6, 8].includes(i) ? "num" : null, text: t })))),
      h("tbody", null, rows.map((t) => h("tr", null,
        coinCell(t),
        h("td", { class: "num strong" }, delta(t.pnl_usd, pct(t.pnl_pct))),
        h("td", { class: "num", text: usdSigned(t.pnl_usd) }),
        h("td", { class: "num", text: usd(t.cost_usd) }),
        h("td", { text: when(t.opened_ts) }),
        h("td", { text: duration(t.duration_s) }),
        h("td", { class: "num", text: pct(t.max_gain_pct) }),
        h("td", { text: EXITS[t.exit_reason] || t.exit_reason || "–" }),
        h("td", { class: "num", text: num(t.score, 1) })))))));
}

function barList(rows) {
  const max = Math.max(1, ...rows.map((r) => r.value));
  return h("div", { class: "bars" }, rows.map((r) => {
    const row = h("div", { class: "bar-row", tabindex: "0", "aria-label": r.label + ": " + r.value + " " + r.unit },
      h("div", { class: "name", text: r.label }),
      h("div", { class: "bar-line" },
        h("div", { class: "bar", style: "width:calc((100% - 44px) * " + (r.value / max).toFixed(4) + ")" }),
        h("div", { class: "bar-val", text: num(r.value) })));
    tipTarget(row, num(r.value) + " " + r.unit, r.tip);
    return row;
  }));
}

function funnelCard(state) {
  const f = state.funnel, total = Math.max(1, f.in_window);
  const share = (n) => num(n / total * 100) + " % af mønterne i vinduet";
  const rows = [
    { label: "Fundet i vinduet", value: f.in_window, tip: ["30 min.–72 t. gamle, $300k–$20M i markedsværdi"] },
    { label: "Bestod filteret", value: f.passed_filter, tip: [share(f.passed_filter)] },
    { label: "Scorede " + num(state.min_score) + " eller mere", value: f.scored_pass, tip: [share(f.scored_pass)] },
    { label: "Købt", value: f.bought, tip: [share(f.bought)] },
  ].map((r) => ({ ...r, unit: r.value === 1 ? "mønt" : "mønter" }));
  return card("Fra fund til handel", "Antal forskellige mønter på hvert trin", barList(rows));
}

function killsCard(state) {
  if (!state.kills.length) return card("Hvorfor mønter blev sorteret fra", null, h("div", { class: "empty", text: "Ingen afvisninger endnu." }));
  const rows = state.kills.map((k) => ({ label: ruleName(k.rule), value: k.coins, unit: k.coins === 1 ? "mønt" : "mønter",
    tip: [STAGES[k.stage] + " · ramt " + num(k.hits) + (k.hits === 1 ? " gang" : " gange")] }));
  return card("Hvorfor mønter blev sorteret fra",
    "Antal mønter pr. regel. En mønt kan falde på flere regler. " + num(state.kill_decisions) + " afvisninger i alt.", barList(rows));
}

function scoresCard(state) {
  if (!state.top_scores.length) return card("Tættest på en handel", null, h("div", { class: "empty", text: "Ingen mønter har bestået filteret endnu." }));
  const lim = state.min_score;
  return card("Tættest på en handel", "Bedste score pr. mønt (0–100) og de seks delscorer bag den",
    h("div", { class: "meters" }, state.top_scores.map((t) => h("div", { class: "meter-row" },
      h("div", null, h("span", { class: "coin", text: t.symbol }), t.traded && h("span", { class: "pill", text: "Handlet" })),
      h("div", { class: "track", role: "img", "aria-label": "Score " + num(t.score, 1) + " af 100, grænse " + num(lim) },
        h("div", { class: "fill", style: "width:" + Math.max(0, Math.min(100, t.score)) + "%" }),
        h("div", { class: "limit", style: "left:" + lim + "%" })),
      h("div", { class: "num strong", text: num(t.score, 1) }),
      h("div", { class: "parts", text: PARTS.map(([k, name]) => name + " " + (t.components[k] == null ? "–" : num(t.components[k]))).join(" · ") })))),
    h("span", { class: "key" }, h("i"), "Grænse for køb: " + num(lim)));
}

function activityText(a) {
  const sym = a.symbol || "";
  switch (a.kind) {
    case "fill_buy": return ["Købte ", h("span", { class: "strong", text: sym }), " for " + usd(a.usd || 0) + (a.score ? " (score " + num(a.score, 1) + ")" : "")];
    case "fill_sell": return ["Solgte ", h("span", { class: "strong", text: sym }), " via " + (EXITS[a.reason] || "salg").toLowerCase() + ": ", delta(a.pnl_usd, usdSigned(a.pnl_usd) + " (" + pct(a.pnl_pct) + ")")];
    case "exit_signal": return [(EXITS[a.reason] || "Stop") + " ramt på ", h("span", { class: "strong", text: sym })];
    case "trail_armed": return ["Trailing stop aktiveret på ", h("span", { class: "strong", text: sym })];
    case "start": return ["Desken startede" + (a.equity != null ? " med " + usd(a.equity) : "")];
    case "stop": return ["Desken stoppede" + (a.equity != null ? " med " + usd(a.equity) : "")];
    case "smart_wallets_learned": return ["Smart wallet-listen voksede til " + num(a.book_size || 0)];
    case "error": return ["Fejl: " + (a.error || "ukendt")];
    default: return [a.kind];
  }
}
function activityCard(state) {
  if (!state.activity.length) return card("Seneste hændelser", null, h("div", { class: "empty", text: "Intet at vise endnu." }));
  return card("Seneste hændelser", "Køb, salg, stop og start/stop af desken",
    h("ul", { class: "feed" }, state.activity.slice(0, 12).map((a) =>
      h("li", null, h("time", { text: when(a.ts) }), h("div", null, activityText(a))))));
}

function recentKillsCard(state) {
  if (!state.recent_kills.length) return null;
  return card("Seneste afvisninger", "De nyeste beslutninger om at springe en mønt over",
    h("div", { class: "scroll" }, h("table", { class: "stack" },
      h("thead", null, h("tr", null, ["Tid", "Mønt", "Trin", "Årsag"].map((t) => h("th", { text: t })))),
      h("tbody", null, state.recent_kills.map((k) => h("tr", null,
        h("td", { class: "t-when", text: when(k.ts) }), coinCell(k, "t-coin"),
        h("td", { class: "t-stage", text: STAGES[k.stage] || k.stage }),
        h("td", { class: "t-why wrap-cell", text: k.reasons.map((r) => reasonText(k.stage, r)).join(" · ") })))))));
}

// ---- render loop --------------------------------------------------------------
let lastKey = "", lastState = null;
function drawCharts() { document.querySelectorAll("[data-chart]").forEach((el) => el._draw && el._draw()); }

function renderStatus(state) {
  const st = state.status, el = $("status");
  if (state.empty || !st || !st.last_event_ts) { el.replaceChildren(h("span", { class: "dot" }), "Desken har ikke kørt endnu"); return; }
  el.replaceChildren(
    h("span", { class: "dot" + (st.running ? " on" : "") }),
    h("strong", { text: st.running ? "Kører" : "Stoppet" }),
    st.running ? "· seneste scanning kl. " + clock(st.last_event_ts) : "· sidst aktiv " + when(st.last_event_ts));
}

function render(state) {
  renderStatus(state);
  const key = JSON.stringify({ ...state, generated_ts: 0 });
  if (key === lastKey) return;
  lastKey = key; lastState = state;
  const main = $("main");
  if (state.empty || !state.status.last_event_ts) {
    main.replaceChildren(card("Ingen data endnu", null,
      h("div", { class: "empty", text: "Start desken med kommandoen  python -m desk run  – så dukker konto, handler og afvisninger op her." })));
    $("foot").textContent = "";
    return;
  }
  hideTip();
  main.replaceChildren(
    kpis(state.account), equityCard(state), openCard(state.open_positions), closedCard(state.closed_trades),
    h("div", { class: "grid2" }, funnelCard(state), killsCard(state)),
    h("div", { class: "grid2" }, scoresCard(state), activityCard(state)),
    recentKillsCard(state));
  drawCharts();
  const st = state.status;
  $("foot").textContent = num(st.cycles) + " scanninger siden " + when(st.first_event_ts) +
    (st.last_scan ? " · seneste scanning så " + num(st.last_scan.mints_seen) + " mønter, " + num(st.last_scan.in_window) + " i vinduet" : "") +
    " · siden opdaterer sig selv hvert 5. sekund";
}

async function tick() {
  try {
    const res = await fetch("api/state", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    document.body.classList.remove("stale");
    render(await res.json());
  } catch (e) {
    document.body.classList.add("stale");           // keep the last frame, dimmed
    $("status").replaceChildren(h("span", { class: "dot" }), "Ingen forbindelse til desken – prøver igen");
  }
}
let resizeTimer = 0;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawCharts, 120); });
tick();
setInterval(tick, 5000);
</script>
</body>
</html>
